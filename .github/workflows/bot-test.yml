name: Telegram Bot Test

on:
  workflow_dispatch:
  push:
    branches: [main]

# Prevent two polling instances of the same Telegram bot from running at once.
concurrency:
  group: telegram-bot-polling-test
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile *.py

      - name: Run bot and verify it stays alive
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          YOUTUBE_COOKIES_FILE: ${{ runner.temp }}/youtube-cookies.txt
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > "$YOUTUBE_COOKIES_FILE"
            chmod 600 "$YOUTUBE_COOKIES_FILE"
          else
            unset YOUTUBE_COOKIES_FILE
          fi
          set +e
          timeout --signal=SIGINT --kill-after=15s 10m python -u main.py
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 130 ]; then
            echo "Bot stayed running for the full smoke-test window."
            exit 0
          fi
          echo "Bot exited early with status $status."
          exit "$status"
